name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm_internal_test
          POSTGRES_USER: crm_ci
          POSTGRES_PASSWORD: ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm_ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: crm_internal_test
      DB_USERNAME: crm_ci
      DB_PASSWORD: ci_password
      REDIS_HOST: 127.0.0.1
      REDIS_PREFIX: crm_internal_ci_
      EMAIL_PROVIDER: fake
      WHATSAPP_PROVIDER: fake
      WHATSAPP_OUTBOUND_MODE: manual
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, bcmath, curl, dom, fileinfo, gd, intl, mbstring, pcntl, zip
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer check-platform-reqs
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      - run: npm run build
      - run: ./vendor/bin/pint --test
      - run: ./vendor/bin/phpstan analyse --no-progress
      - run: php artisan test
      - run: composer audit
      - run: npm audit --audit-level=high

  e2e:
    needs: backend
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm_internal_test
          POSTGRES_USER: crm_ci
          POSTGRES_PASSWORD: ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm_ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: crm_internal_test
      DB_USERNAME: crm_ci
      DB_PASSWORD: ci_password
      REDIS_HOST: 127.0.0.1
      REDIS_PREFIX: crm_internal_ci_
      EMAIL_PROVIDER: fake
      WHATSAPP_PROVIDER: fake
      WHATSAPP_OUTBOUND_MODE: manual
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, bcmath, curl, dom, fileinfo, gd, intl, mbstring, pcntl, zip
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate --force
      - run: php artisan db:seed --force
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: php artisan serve &
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
